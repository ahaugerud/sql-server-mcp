[project]
name = "sql-server-mcp"
version = "0.5.0"
description = "Local, single-user MCP server for read-only SQL Server / MS Fabric queries - one process per tenant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Alexander Haugerud", email = "ahaugerud@inspirit365.com" },
]
keywords = ["mcp", "sql-server", "fabric", "azure", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    "azure-identity>=1.25.3",
    "fastmcp>=3.3.0",
    "mssql-python>=1.14.0",
    "pyarrow>=25.0.0",
    "sqlglot>=26.0.0",
]

[project.urls]
Repository = "https://github.com/ahaugerud/sql-server-mcp"

[project.scripts]
sql-server-mcp = "sql_server_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_server_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
